openapi: 3.1.0
info:
  title: Lab Manager API
  version: 1.0.0-draft.13
  summary: Contract between Runekeeper (client) and the Lab Manager (server).
  description: |
    Status: DRAFT under joint review. Implemented by the Lab Manager, which
    validates its own responses against this file in tests.

    This file is the source of truth for the contract. Both repositories
    generate TypeScript types from it, and the Lab Manager validates its
    responses against it in tests. `docs/api/v1-draft.md` explains the
    reasoning; where the two differ, this file wins.

    Conventions
    - JSON, camelCase. Ids are opaque strings with a type prefix. Times are
      ISO-8601 UTC.
    - Mutations return quickly with the new or pending state; completion is
      reported on the event stream.
    - Every POST accepts `Idempotency-Key`. Same key and body returns the
      original response; same key with a different body is 409
      `idempotency_conflict`. Keys are kept for 24 hours.
    - PATCH is naturally idempotent and takes no key.
    - Research endpoints (tag `research`) are implemented but new: they
      have not yet been used by a client and may still change before 1.0.

    What changed in draft.13 (additive)
    - `DELETE /v1/labs/{labId}`: deletes a lab for good. New error code
      `lab_not_stopped` (409). New event `lab.deleted`.

    What changed in draft.12 (additive)
    - Labs can be archived: `POST /v1/labs/{labId}/archive` and
      `/unarchive`. Nothing is deleted. `GET /v1/labs` leaves archived labs
      out; `?archived=true` lists only those. `LabSummary.archivedAt`.

    What changed in draft.11 (additive)
    - Each entry of `Job.delegations` gains `body`: for a refused handoff,
      the instructions the target would have been given (capped at 8000
      characters), so a person can send them as their own instruction. Null
      when dispatched.

    What changed in draft.10 (additive; nothing signed changed)
    - Delegation by the Orchestrator, a host setting that is off by default
      (`Health.capabilities.delegation`). When on, in manual mode, each
      handoff the Orchestrator records while answering a message from the
      owner is started by the manager as a task for the role it names: at
      most `Health.limits.delegationsPerMessage`, one hop only, nothing
      queued. See `docs/api/2026-10-11-delegation-draft.md`.
    - `Job.origin` gains `delegated`. New `Job.delegation` (who delegated
      it), `Job.delegations` (what became of each handoff the job recorded)
      and `Job.stateNote` (what the manager told the Orchestrator about the
      lab before the owner's message; on `GET /v1/jobs/{id}` only).
    - New transcript item kind `delegatedInstruction`. Never a
      `humanMessage`: it was written by the Orchestrator.
    - `Handoff.dispatch`. `GET /v1/labs/{id}/jobs?delegatedBy=<jobId>`.
    - New events `handoff.dispatched` (Handoff) and `job.updated` (Job: the
      originating job, whenever one of its delegations changes).

    What changed in draft.9 (additive; nothing signed changed, the binding
    vectors are the same)
    - `Health.capabilities` gains `workspaceWrites`, `webSearch` and
      `uncoveredRequests`: standing rules for manual mode that the owner sets
      on the host. No API call can set them.
    - A tool call's `decidedBy` of type `standingRule` may now have outcome
      `deny` (rule `denyUncovered`); `rule` is one of `recordWrites`,
      `workspaceWrites`, `webSearch`, `denyUncovered`.

    What changed in draft.8 (breaking; see "Upgrading from draft.6")
    - The only signed actions are `budget.set` (the lab's SPENDING limit)
      and `approval.decision`. `job.retry` and `experiment.conclude` are no
      longer signed actions. An endpoint that is not signed REJECTS a
      request that carries an `authorization` (400), it never ignores one.
    - The signed text now starts with `lab-authz-v3`. A `lab-authz-v2`
      signature never verifies.
    - Budget is three blocks that are never mixed: `runtime` (measured by
      the Lab Manager), `spend` (signed by a human, verified by the Lab
      Manager) and `estimates` (reported by agents).
    - A host policy may let a lab run without a human approving each step.
      Decisions made by the policy are a different shape from decisions made
      by a human and are never presented as signatures.

    Autonomy and the host policy
    - The policy is a file on the host. It is read once when the Lab Manager
      starts. No endpoint creates, changes or reloads it. `Health.policy`
      reports whether one is active, its id and hash, and the runtime cap.
    - Without a policy the Lab Manager is in manual mode: every tool request
      is an approval a human signs, experiments need a signed approval, and
      no agent has a shell.
    - With a policy in `autonomous` mode: tool requests are answered by the
      policy and recorded as PolicyDecision; an experiment that declares no
      paid resource or credential is admitted by the policy; the Lab Manager
      starts planning, execution, review and checkpoint jobs itself
      (`Job.origin = policy`); a review ends an experiment.
    - A decision is exactly one of two shapes. Human: an actor and a
      SignedAuthorization. Policy: no actor and no authorization; the policy
      id and hash, the rule that matched and the facts it matched on. No
      endpoint lets a client create a policy decision.
    - Money. The default and, today, the only reachable spending limit is 0.
      `Health.spend.metering` is `none`: no paid mechanism exists whose
      limits the Lab Manager can enforce, so `POST .../budget` refuses any
      amount above zero with 412 `spend_metering_unavailable`. An experiment
      whose proposal declares a paid resource or a credential becomes
      `blocked` and raises an escalation; no approval is raised, because
      nothing could honour one. The declaration is agent-reported. The Lab
      Manager cannot detect an undeclared cost; what prevents one is that
      agents hold no payment method and no credential.
    - Reserved, not implemented: approval kind `spend`. Its binding will
      name the mechanism, the payee or resource, a cap and currency, an
      expiry, the lab and experiment, and be single-use.
    - The name `costUsd` now appears only in fields kept for a draft.6
      client (`Budget.limits`, `Budget.consumed`, `Job.usage.costUsd`), all
      deprecated. Everywhere else a dollar figure is either
      `spendLimitUsd`/`signedLimitUsd`/`verifiedChargesUsd` (money) or
      `notionalModelCostUsd` (an agent-side estimate, render it with the
      estimates). No binding other than BudgetBinding contains a dollar
      figure.
    - The owner's stop conditions map as follows. Unauthorized charge ->
      `unauthorized_charge`. Unenforceable boundary -> `security_boundary`.
      Missing inputs -> `no_open_questions` when the lab has nothing to
      work on; an agent that lacks an input it needs raises
      `human_decision`. Subscription limit -> not an escalation: it is the
      hold in `Health.subscription`, announced by `manager.healthChanged`,
      and clears by itself. Repeated failure -> `repeated_failures`. Lack of
      progress -> `no_progress`. A human decision that is needed ->
      `human_decision`. Runtime used up -> `runtime_exhausted`.
    - `ShellCapability.reason` and `PolicyDecision.rule` are open strings
      with documented known values. A client prints an unknown value
      verbatim. `Escalation.reason` is a closed enum.
    - Stop conditions raise an Escalation (`escalation.recorded`). Resolving
      an escalation is an acknowledgement only. It approves nothing and
      resumes nothing: the Lab Manager re-checks each condition itself. A
      lab paused after repeated failures or lack of progress continues only
      through `POST /v1/labs/{labId}/resume`.
    - A shell is granted only when `Health.capabilities.shell.<role>.allowed`
      is true. If the policy grants a role a shell and the boundary cannot
      be verified, that role's jobs are refused with 412
      `isolation_required`. It is never run on a weaker boundary instead.

    Upgrading from draft.6
    - `Budget.limits` and `Budget.consumed` remain for one release, marked
      deprecated, so a draft.6 client still loads. In them `costUsd` is
      money only (the signed spending limit, and 0 consumed), never an
      estimate. A client must stop reading them before the next draft.
    - Deploy order: the client that reads the three blocks ships first, then
      the Lab Manager is upgraded.

    Research records
    - Agents never call this API. An agent proposes a record by leaving a
      JSON file in its workspace outbox; when its job ends the Lab Manager
      reads the outbox, validates each file as untrusted input, enforces
      which role may record what, and stores accepted content by SHA-256
      computed from the bytes it received. Rejections appear as `systemNote`
      items in that agent's transcript.
    - Stored content is immutable and addressed by hash (`ArtifactRef`).
      `GET /v1/labs/{labId}/artifacts/{hash}` always returns the whole
      document, so a client can verify `sha256(utf8(content)) == hash`.
    - A protocol version never changes. A revision is a new version with a
      new hash, and it voids any approval given or pending for the old one.
    - An approval of kind `experiment` authorizes ONE execution attempt of
      exactly the protocol hash and version in its request, under exactly
      the limits in its binding. Its binding has `jobId: null` and
      `experimentId` equal to `request.experimentId`.
    - An experiment's `limits` and `estimate` change only through a protocol
      revision, which voids the approval. The job runs under the signed
      limits or less (they are reduced to what remains of the lab budget),
      never more.
    - A given approval is usable until the `expiresAt` in its binding, which
      the human signed. After that the experiment returns to
      `protocolRegistered` and needs a new approval.
    - Stored text is hashed over exactly the UTF-8 bytes the Lab Manager
      stored and returns: no normalisation, and no newline added or removed.
    - A review ends an experiment (`reviewed`). A person may add an
      assessment afterwards. It is optional, unsigned, changes no status,
      and no rule reads it as an input that widens anything. Agents see it
      only as labelled owner feedback.
    - After an execution the Lab Manager takes its own copy of the
      experiment's working directory (`Experiment.snapshot`), hashes the
      bytes it received, and stores it where no agent can write. The
      Reviewer receives that copy and its verdict must cite the hash.
      `snapshot.commit` is reported by the Executor's side.

    Authorization
    - The bearer token authenticates Runekeeper's server. Both sides read it
      from a file, never from an environment variable. During a rotation the
      Lab Manager accepts two tokens at once.
    - Every authenticated request, including reads and the event stream,
      must carry `X-Lab-Actor-Id` and `X-Lab-Actor-Email`. The Lab Manager
      checks the actor id against its own allowlist (`LAB_ALLOWED_ACTOR_IDS`)
      and refuses to start when that allowlist is empty. A missing or
      unlisted actor is 403 `actor_not_allowed`.
    - Calls that authorize execution or spend (approval decisions, retrying
      an interrupted job, changing budget limits) additionally carry a signed
      `Authorization` object; see the `SignedAuthorization` schema. Runekeeper
      holds the Ed25519 private key; the Lab Manager holds only the public
      key, verifies before acting, and stores the signed record.

    Status semantics
    - Lab status is derived from its agents: `stopped` when none is up,
      `running` when at least one is, `degraded` when one has crashed,
      `paused` only when a human paused it.
    - Starting an agent consumes no budget and runs no model call. It
      provisions the workspace and runs a preflight with the real Claude Code
      binary; the result is recorded as a `systemNote` transcript item.
    - `capabilities.*.reason` is a free string. Values in use:
      `agent_isolation_missing`, `isolation_unverified`,
      `isolation_check_failed`, `sandbox_unavailable`,
      `not_approved_by_owner`, `not_enabled_in_this_build`, `not_implemented`.
servers:
  - url: http://127.0.0.1:7717
    description: Native development (loopback TCP).
  - url: http://lab-manager
    description: >-
      Production. HTTP over the Unix domain socket /run/lab-manager/api.sock;
      the host name is a placeholder.
security:
  - serviceToken: []
    actorId: []
    actorEmail: []
tags:
  - name: health
  - name: labs
  - name: agents
  - name: jobs
  - name: approvals
  - name: research
  - name: events

paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness, API version and degraded reasons. Unauthenticated; answers from memory.
      security: []
      responses:
        "200":
          description: Service is up (possibly degraded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/labs:
    get:
      tags: [labs]
      operationId: listLabs
      summary: List labs.
      parameters:
        - name: archived
          in: query
          description: "`true`: only archived labs. Default: only labs that are not archived."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The labs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LabSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [labs]
      operationId: createLab
      summary: Create a lab, its repository, agent workspaces and four unprovisioned agents.
      description: |
        A new lab has zero budget limits and cannot run any job until a
        signed `setLabBudget` call. Creating a lab therefore authorizes no
        spend.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                objective: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabSnapshot" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}:
    parameters:
      - $ref: "#/components/parameters/LabId"
    get:
      tags: [labs]
      operationId: getLabSnapshot
      summary: Everything the dashboard needs in one call, with the event cursor it was taken at.
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabSnapshot" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [labs]
      operationId: updateLab
      summary: Update name, objective, priorities or approval policy. Budget limits have their own signed endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                objective: { type: string, maxLength: 4000 }
                priorities:
                  type: array
                  maxItems: 20
                  items: { type: string, maxLength: 500 }
                approvalPolicy: { $ref: "#/components/schemas/ApprovalPolicy" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lab" }
        default: { $ref: "#/components/responses/Error" }

    delete:
      tags: [labs]
      operationId: deleteLab
      summary: Delete a lab for good. Cannot be undone.
      description: |
        Unsigned; takes an `Idempotency-Key` like a POST, and a repeat with
        the same key returns the first receipt.

        Refused with 409 `lab_not_stopped` while any agent is starting, idle,
        working or waiting, or any task is running (`details.agents` lists the
        roles, `details.jobs` the job ids). The delete stops nothing itself:
        stop the lab first. Interrupted tasks awaiting reconciliation do not
        block it. Refused with 503 `manager_degraded`, and nothing is deleted,
        when the agent worker cannot be reached or the files cannot be removed.

        **Removed:** the lab; its agents; jobs and their logs; transcripts;
        approvals; questions, experiments and their protocol versions;
        results, reviews, findings, handoffs, decisions, escalations and
        checkpoints; delegations; policy decisions; stored snapshots; each
        agent's workspace directory on disk; and the session files Claude
        Code keeps for those agents, so their conversations cannot be resumed
        or recovered. The lab's past events leave the event history.

        **Kept:** a tombstone (lab id, name, who deleted it, when, and the
        counts in the receipt), and every signed authorization recorded for
        the lab, which remains verifiable by itself. Stored text that
        another lab's record also uses is kept for that lab.

        Afterwards the lab, its agents and its jobs are 404. Any lab may be
        deleted, including the last one. Emits `lab.deleted` with the receipt,
        on the stream without a lab filter.
      parameters:
        - $ref: "#/components/parameters/LabId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabDeletionReceipt" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/labs/{labId}/budget:
    post:
      tags: [labs]
      operationId: setLabBudget
      summary: Set the lab's spending limit. The only signed setting, because it is the only one that authorizes money.
      description: |
        The signature covers a BudgetBinding, which includes the limit in
        force before the change and the hash of the host policy in force.
        While `Health.spend.metering` is `none`, any amount above zero is
        refused with 412 `spend_metering_unavailable` before the signature
        is looked at, and nothing is recorded.
      parameters:
        - $ref: "#/components/parameters/LabId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spendLimitUsd, authorization]
              additionalProperties: false
              properties:
                spendLimitUsd: { type: number, minimum: 0 }
                note: { type: string, maxLength: 2000 }
                authorization: { $ref: "#/components/schemas/SignedAuthorization" }
      responses:
        "200":
          description: Limit updated; `budget.updated` is emitted with the actor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/runtime-limit:
    post:
      tags: [labs]
      operationId: setLabRuntimeLimit
      summary: Set how many minutes agents may run in this lab in total. Not money, so not signed.
      description: |
        Capped by `Health.policy.runtimeCapMinutes`, which is set on the
        host only. Above the cap: 400 `validation_failed` with
        `details.capMinutes`. A request carrying an `authorization` is
        rejected. With shells and no spending, this is the limit that
        binds, and it can be moved by any caller holding the service token:
        the client should require explicit confirmation before raising it.
      parameters:
        - $ref: "#/components/parameters/LabId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallClockMinutes]
              additionalProperties: false
              properties:
                wallClockMinutes: { type: number, minimum: 0 }
      responses:
        "200":
          description: Limit updated; `budget.updated` is emitted with the actor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/policy-decisions:
    get:
      tags: [labs]
      operationId: listPolicyDecisions
      summary: Everything that ran in this lab on the policy's say-so instead of a human's, newest first.
      parameters:
        - $ref: "#/components/parameters/LabId"
        - name: subject
          in: query
          schema: { type: string, enum: [experiment, tool, job] }
        - name: before
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of policy decisions.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PolicyDecision" } }
                  nextCursor: { $ref: "#/components/schemas/Cursor" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/start:
    post:
      tags: [labs]
      operationId: startLab
      summary: Provision any missing sessions and start all agents.
      parameters: &labActionParams
        - $ref: "#/components/parameters/LabId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: &labActionResponses
        "202":
          description: Accepted; progress is reported on the event stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lab" }
        default: { $ref: "#/components/responses/Error" }
  /v1/labs/{labId}/pause:
    post:
      tags: [labs]
      operationId: pauseLab
      summary: Stop dispatching new jobs; running jobs finish.
      parameters: *labActionParams
      responses: *labActionResponses
  /v1/labs/{labId}/resume:
    post:
      tags: [labs]
      operationId: resumeLab
      summary: Resume dispatching.
      parameters: *labActionParams
      responses: *labActionResponses
  /v1/labs/{labId}/stop:
    post:
      tags: [labs]
      operationId: stopLab
      summary: Cancel running jobs and stop all agents.
      parameters: *labActionParams
      responses: *labActionResponses

  /v1/labs/{labId}/archive:
    post:
      tags: [labs]
      operationId: archiveLab
      summary: Put a lab away. Deletes nothing.
      description: |
        The lab disappears from `GET /v1/labs` and takes no work: starting an
        agent, sending a message or starting a task is 409 `conflict` with
        `details.archived`. Everything stays readable by id: transcript,
        jobs, records and the agents' files. Refused with 409 `conflict`
        unless every agent is stopped and no task is running; stop the lab
        first. Archiving an archived lab changes nothing. Emits `lab.updated`.
      parameters:
        - $ref: "#/components/parameters/LabId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The lab, with `archivedAt` set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lab" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/labs/{labId}/unarchive:
    post:
      tags: [labs]
      operationId: unarchiveLab
      summary: Bring an archived lab back.
      parameters:
        - $ref: "#/components/parameters/LabId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The lab, with `archivedAt` null. It is stopped; start it as usual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lab" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List a lab's agents.
      parameters:
        - $ref: "#/components/parameters/LabId"
      responses:
        "200":
          description: The lab's agents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/agents/{agentId}:
    get:
      tags: [agents]
      operationId: getAgent
      summary: Get one agent.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/agents/{agentId}/start:
    post:
      tags: [agents]
      operationId: startAgent
      summary: Provision the session if needed and become idle.
      parameters: &agentActionParams
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: &agentActionResponses
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agents/{agentId}/stop:
    post:
      tags: [agents]
      operationId: stopAgent
      summary: Cancel the current job and become stopped.
      parameters: *agentActionParams
      responses: *agentActionResponses
  /v1/agents/{agentId}/restart:
    post:
      tags: [agents]
      operationId: restartAgent
      summary: Stop, then start with the same session.
      parameters: *agentActionParams
      responses: *agentActionResponses
  /v1/agents/{agentId}/resume:
    post:
      tags: [agents]
      operationId: resumeAgent
      summary: Recover a crashed or stopped agent, optionally with a fresh session seeded from repository state.
      parameters: *agentActionParams
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newSession: { type: boolean, default: false }
      responses: *agentActionResponses
  /v1/agents/{agentId}/mode:
    post:
      tags: [agents]
      operationId: setAgentMode
      summary: Switch between manager-driven and tmux (human-driven) operation. Stops the other driver.
      description: |
        In tmux mode, permission prompts are answered at the terminal and do
        not appear in the approval queue. The switch is recorded as an event
        with the actor and is refused with 412 `isolation_required` unless
        `capabilities.tmuxMode.allowed`. Not part of milestone 1.
      parameters: *agentActionParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/AgentMode" }
      responses: *agentActionResponses

  /v1/agents/{agentId}/messages:
    post:
      tags: [agents]
      operationId: sendAgentMessage
      summary: Send a human message to an agent. Creates a job of kind `message`.
      description: |
        Accepted only when the agent is `idle`. In `starting`, `working` or
        `waitingOnHuman` the call is 409 `agent_busy` (a session blocked on a
        prompt cannot take input); in tmux mode it is 409 `tmux_mode_active`.
        There is no message queue in v1.
      parameters: *agentActionParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job, transcriptItem]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  transcriptItem: { $ref: "#/components/schemas/TranscriptItem" }
        default: { $ref: "#/components/responses/Error" }

  /v1/agents/{agentId}/transcript:
    get:
      tags: [agents]
      operationId: getAgentTranscript
      summary: Structured transcript. Without a cursor, returns the newest items.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of transcript items, in ascending `seq` order.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TranscriptItem" }
                  nextCursor: { $ref: "#/components/schemas/Cursor" }
        default: { $ref: "#/components/responses/Error" }

  /v1/agents/{agentId}/files:
    get:
      tags: [agents]
      operationId: listAgentFiles
      summary: List one directory of the agent's workspace. Read-only.
      description: |
        For seeing what a task produced. `path` is relative to the
        workspace; empty is the workspace itself. A path that leaves the
        workspace, directly or through a symbolic link, is refused (400).
        Works whether or not the agent is running. Names and contents come
        from the agent side and are untrusted.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: path
          in: query
          schema: { type: string, maxLength: 1024, default: "" }
      responses:
        "200":
          description: Up to 500 entries, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [agentId, path, entries, truncated]
                properties:
                  agentId: { type: string }
                  path: { type: string }
                  truncated: { type: boolean }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, type, size, modifiedAt]
                      properties:
                        name: { type: string }
                        type: { type: string, enum: [file, directory, other], description: "`other` includes symbolic links; they are listed, never followed out of the workspace." }
                        size: { type: integer }
                        modifiedAt: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /v1/agents/{agentId}/files/content:
    get:
      tags: [agents]
      operationId: readAgentFile
      summary: Read the first 256 KB of one regular file in the agent's workspace.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: path
          in: query
          required: true
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: "The file's text, or binary true with null content."
          content:
            application/json:
              schema:
                type: object
                required: [agentId, path, size, encoding, content, truncated, binary]
                properties:
                  agentId: { type: string }
                  path: { type: string }
                  size: { type: integer }
                  encoding: { type: string, enum: [utf8] }
                  content: { type: [string, "null"] }
                  truncated: { type: boolean }
                  binary: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List jobs, newest first.
      parameters:
        - $ref: "#/components/parameters/LabId"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/JobStatus" }
        - name: agentId
          in: query
          schema: { type: string }
        - name: delegatedBy
          in: query
          description: Only the jobs delegated by this job.
          schema: { type: string }
        - name: kind
          in: query
          description: Defaults to `task`; pass `message` or `all` to include human-message jobs.
          schema: { type: string, enum: [task, message, all], default: task }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  nextCursor: { $ref: "#/components/schemas/Cursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [jobs]
      operationId: createJob
      summary: Dispatch a bounded task to an agent.
      parameters: *labActionParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, title, instructions]
              properties:
                agentId: { type: string }
                title: { type: string, minLength: 1, maxLength: 200 }
                instructions: { type: string, minLength: 1, maxLength: 20000 }
                experimentId: { type: string }
                limits: { $ref: "#/components/schemas/JobLimits" }
      responses:
        "202":
          description: |
            Queued, or `awaitingApproval` with `approvalId` set when the task
            needs a human decision first. 412 is returned only when no
            approval can help (`budget_exceeded`, `isolation_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /v1/jobs/{jobId}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get one job.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /v1/jobs/{jobId}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a queued or running job.
      parameters: &jobActionParams
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancelling.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /v1/jobs/{jobId}/reconcile:
    post:
      tags: [jobs]
      operationId: reconcileJob
      summary: Resolve a job that was interrupted by a manager restart.
      description: |
        Interrupted jobs are never re-executed automatically. Neither
        resolution is signed, and a request carrying an `authorization` is
        rejected. In an autonomous lab the policy acknowledges an
        interrupted job itself (`reconciliation.actor` is null and
        `reconciliation.policy` is set); it never retries one. A human either
        acknowledges the interruption or asks for a retry, which creates a NEW
        job (returned as `retryJob`) with the same instructions and
        `retryOfJobId` set. The new job inherits no approvals and must obtain
        fresh ones. Until an
        agent's interrupted job is reconciled, no new `task` job is dispatched
        to that agent (`Agent.blockedBy` says so); human messages are still
        accepted. `job.reconciled` and `agent.stateChanged` are emitted when
        the hold clears.
      parameters: *jobActionParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              additionalProperties: false
              properties:
                resolution: { type: string, enum: [acknowledge, retry] }
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Reconciled.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  retryJob: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /v1/jobs/{jobId}/logs:
    get:
      tags: [jobs]
      operationId: getJobLogs
      summary: Paginated log lines. Without `after`, returns the tail.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of log lines in ascending order.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LogLine" }
                  nextCursor: { $ref: "#/components/schemas/Cursor" }
        default: { $ref: "#/components/responses/Error" }

  /v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approvals.
      parameters:
        - name: labId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApprovalStatus" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ApprovalKind" }
        - name: agentId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of approvals; pending first, then newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Approval" }
                  nextCursor: { $ref: "#/components/schemas/Cursor" }
        default: { $ref: "#/components/responses/Error" }

  /v1/approvals/{approvalId}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Get one approval with its complete request.
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        default: { $ref: "#/components/responses/Error" }

  /v1/approvals/{approvalId}/decision:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Record a human decision. The only way a decision is ever created.
      description: |
        Decisions are once-only and apply to exactly one request; there is no
        "always allow" in v1. The signature binds the decision to the
        approval's `requestHash`, so it cannot be replayed against a different
        request. Fetch the approval by id first: only that response is
        guaranteed to carry the complete request.
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, authorization]
              properties:
                outcome: { type: string, enum: [approved, denied] }
                note: { type: string, maxLength: 2000, description: "On a denial, delivered to the agent as the reason." }
                authorization: { $ref: "#/components/schemas/SignedAuthorization" }
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/questions:
    get:
      tags: [research]
      operationId: listQuestions
      summary: List research questions, newest first.
      parameters:
        - $ref: "#/components/parameters/LabId"
      responses:
        "200":
          description: Research questions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Question" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [research]
      operationId: createQuestion
      summary: The human assigns a research question or objective.
      parameters: *labActionParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 300 }
                body: { type: string, maxLength: 20000 }
                priority: { type: string, enum: [low, medium, high], default: medium }
      responses:
        "201":
          description: Created with status `open`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        default: { $ref: "#/components/responses/Error" }

  /v1/questions/{questionId}/status:
    post:
      tags: [research]
      operationId: setQuestionStatus
      summary: Change a question's status. At most one question per lab is active; activating one returns the previous one to open.
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/QuestionStatus" }
      responses:
        "200":
          description: The question.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/experiments:
    get:
      tags: [research]
      operationId: listExperiments
      summary: List experiments, newest first.
      parameters:
        - $ref: "#/components/parameters/LabId"
      responses:
        "200":
          description: Experiments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Experiment" } }
        default: { $ref: "#/components/responses/Error" }

  /v1/experiments/{experimentId}:
    get:
      tags: [research]
      operationId: getExperiment
      summary: One experiment with its protocol versions, jobs, approvals, results and review.
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Experiment detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentDetail" }
        default: { $ref: "#/components/responses/Error" }

  /v1/experiments/{experimentId}/request-approval:
    post:
      tags: [research]
      operationId: requestExperimentApproval
      summary: Raise a new approval for the current protocol version.
      description: |
        Only from `protocolRegistered`, which an experiment returns to when
        its approval is denied, expires, or was spent on an attempt that
        recorded no result. 409 `conflict` otherwise.
      parameters: &experimentActionParams
        - $ref: "#/components/parameters/ExperimentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The experiment, now `awaitingApproval`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        default: { $ref: "#/components/responses/Error" }

  /v1/experiments/{experimentId}/execute:
    post:
      tags: [research]
      operationId: executeExperiment
      summary: Start the one execution attempt an approval authorizes.
      description: |
        The Lab Manager builds the Executor's instructions itself from the
        approved protocol text and starts a task job under the approved
        limits. 412 `approval_required` unless the experiment is `approved`;
        412 `protocol_changed` if the current protocol is not the approved
        one or the approval has passed its `expiresAt`. The usual job
        preconditions apply (agent idle, budget, no reconciliation
        outstanding). In the response, `experiment.approvalId` and
        `experiment.approvedProtocolHash` are the approval and protocol this
        attempt consumed. If the attempt ends without a recorded
        result, the experiment returns to `protocolRegistered` and needs a
        new approval.
      parameters: *experimentActionParams
      responses: &experimentJobResponses
        "202":
          description: The experiment and the job that was started.
          content:
            application/json:
              schema:
                type: object
                required: [experiment, job]
                properties:
                  experiment: { $ref: "#/components/schemas/Experiment" }
                  job: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /v1/experiments/{experimentId}/review:
    post:
      tags: [research]
      operationId: reviewExperiment
      summary: Start an independent review of an executed experiment.
      description: |
        The Reviewer is given the approved protocol and the recorded results
        by the Lab Manager, with their hashes, and must cite those hashes in
        its verdict. 409 `conflict` unless the experiment is `executed` and
        no other job is running in the lab; while the review runs, no other
        agent in the lab can start work. If the review ends without a valid
        verdict the experiment returns to `executed`.
      parameters: *experimentActionParams
      responses: *experimentJobResponses

  /v1/experiments/{experimentId}/assessment:
    post:
      tags: [research]
      operationId: assessExperiment
      summary: Record a person's opinion of a reviewed experiment. Optional and unsigned.
      description: |
        Allowed only for a `reviewed` experiment (409 otherwise). It changes
        no status and gates nothing. It is recorded on the experiment and in
        the decision log with the actor and `authentication: unsigned`, and
        it reaches agents only as labelled owner feedback. A request
        carrying an `authorization` is rejected.
      parameters: *experimentActionParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              additionalProperties: false
              properties:
                outcome: { type: string, enum: [agree, disagree] }
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The experiment with the assessment recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        default: { $ref: "#/components/responses/Error" }

  /v1/experiments/{experimentId}/abandon:
    post:
      tags: [research]
      operationId: abandonExperiment
      summary: End an experiment that will not be taken further. Unsigned; it only prevents work.
      description: Allowed from any state that is not final. Cancels a pending approval. Refused (409) while a job for the experiment is running.
      parameters: *experimentActionParams
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The abandoned experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/escalations:
    get:
      tags: [research]
      operationId: listEscalations
      summary: Things a person should look at, newest first.
      parameters:
        - $ref: "#/components/parameters/LabId"
      responses:
        "200":
          description: Escalations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Escalation" } }
        default: { $ref: "#/components/responses/Error" }

  /v1/escalations/{escalationId}/resolve:
    post:
      tags: [research]
      operationId: resolveEscalation
      summary: Acknowledge an escalation. It approves nothing and resumes nothing.
      parameters:
        - name: escalationId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The resolved escalation; `escalation.resolved` is emitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Escalation" }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/checkpoints:
    get:
      tags: [research]
      operationId: listCheckpoints
      summary: Progress reports written after every `Health.policy.checkpointEvery` reviewed experiments, newest first.
      parameters:
        - $ref: "#/components/parameters/LabId"
      responses:
        "200":
          description: Checkpoints.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Checkpoint" } }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/findings:
    get:
      tags: [research]
      operationId: listFindings
      summary: List findings, newest first.
      parameters:
        - $ref: "#/components/parameters/LabId"
      responses:
        "200":
          description: Findings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/decisions:
    get:
      tags: [research]
      operationId: listResearchDecisions
      summary: List the research decision log, newest first (not approval decisions).
      parameters:
        - $ref: "#/components/parameters/LabId"
      responses:
        "200":
          description: Decisions recorded by agents, and unsigned feedback and abandonments recorded by a person.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ResearchDecision" } }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/handoffs:
    get:
      tags: [research]
      operationId: listHandoffs
      summary: List handoffs between roles, newest first.
      parameters:
        - $ref: "#/components/parameters/LabId"
      responses:
        "200":
          description: Handoffs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Handoff" } }
        default: { $ref: "#/components/responses/Error" }

  /v1/labs/{labId}/artifacts/{hash}:
    get:
      tags: [research]
      operationId: getArtifact
      summary: One stored document, whole, by content hash.
      description: |
        Only content that a record or protocol in this lab refers to. Never
        truncated: protocols are at most 64 KiB and other bodies 128 KiB.
      parameters:
        - $ref: "#/components/parameters/LabId"
        - { name: hash, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /v1/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Ordered Server-Sent Events stream with replay.
      description: |
        Each SSE message has `id` (the cursor), `event` (the type) and a JSON
        `data` payload matching `Event`. Cursors are strictly increasing across
        the whole service and remain valid across manager restarts. A comment
        line is sent every 15 seconds. Multiple concurrent consumers are
        supported.

        Resume with `after` or the `Last-Event-ID` header (the header wins).
        With neither, the stream starts from now. A cursor older than
        retention is refused with 410 `cursor_expired` before the stream
        opens; the client refetches the snapshot and resubscribes from its
        `eventCursor`.
      parameters:
        - name: after
          in: query
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
        - name: labId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /v1/events/history:
    get:
      tags: [events]
      operationId: listEvents
      summary: The same events, paginated backwards, for the activity view.
      parameters:
        - name: labId
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/EventType" }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  nextCursor: { $ref: "#/components/schemas/Cursor" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Shared service secret held by Runekeeper's server. Never sent to a browser.
    actorId:
      type: apiKey
      in: header
      name: X-Lab-Actor-Id
      description: Runekeeper `users.id` (uuid) of the acting human. Checked against the manager's allowlist and recorded.
    actorEmail:
      type: apiKey
      in: header
      name: X-Lab-Actor-Email
      description: Email of the acting human. Recorded for audit; not an allowlist key.

  parameters:
    LabId: { name: labId, in: path, required: true, schema: { type: string } }
    ExperimentId: { name: experimentId, in: path, required: true, schema: { type: string } }
    AgentId: { name: agentId, in: path, required: true, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string } }
    ApprovalId: { name: approvalId, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    Before:
      name: before
      in: query
      description: Return items older than this cursor.
      schema: { type: string }
    After:
      name: after
      in: query
      description: Return items newer than this cursor.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Error:
      description: |
        Error envelope. Status mapping: 400 validation_failed · 401
        unauthenticated · 403 actor_not_allowed, signature_invalid · 404
        not_found · 409 conflict family · 410 cursor_expired, approval_expired ·
        412 precondition family · 429 rate_limited · 502 claude_code_failed ·
        503 manager_degraded. Every 412 carries actionable `details`:
        `approvalId` for approval_required; `metric`, `limit` and `consumed`
        for budget_exceeded; `capability` for isolation_required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Cursor:
      type: [string, "null"]
      description: Opaque. Null when there are no further items.
    Timestamp: { type: string, format: date-time }

    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthenticated
        - actor_not_allowed
        - not_found
        - conflict
        - agent_already_running
        - agent_not_running
        - agent_busy
        - tmux_mode_active
        - job_not_cancellable
        - job_not_interrupted
        - reconciliation_required
        - approval_already_decided
        - signature_invalid
        - idempotency_conflict
        - cursor_expired
        - approval_expired
        - approval_required
        - budget_exceeded
        - spend_metering_unavailable
        - subscription_limited
        - host_busy
        - disk_low
        - isolation_required
        - protocol_changed
        - claude_code_failed
        - manager_degraded
        - lab_not_stopped
        - rate_limited
        - internal_error
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            retryable: { type: boolean }
            details: { type: object, additionalProperties: true }

    Health:
      type: object
      required: [status, apiVersion, serviceVersion, degraded, reasons, policy, spend, subscription, resources, reviewIndependence, capabilities]
      properties:
        policy:
          type: object
          description: Which rules are in force. Set on the host only; no endpoint changes it.
          required: [active, mode, id, hash, runtimeCapMinutes, checkpointEvery]
          properties:
            active: { type: boolean }
            mode: { type: string, enum: [manual, autonomous] }
            id: { type: [string, "null"] }
            hash: { type: [string, "null"], description: "sha256 of the canonical JSON of the policy file. Part of every PolicyDecision and of every binding." }
            runtimeCapMinutes: { type: number, description: "The most a lab's runtime limit may be set to." }
            checkpointEvery: { type: [integer, "null"] }
        spend:
          type: object
          required: [metering]
          properties:
            metering:
              type: string
              enum: [none, active]
              description: "`none`: no paid mechanism exists whose limits the Lab Manager can enforce, so no spending can be authorized and no charge can be verified."
        subscription:
          type: object
          description: Whether model work is suspended because the Claude subscription's usage limit appears to be reached.
          required: [state, until, basis, reportedAt, windows, overage]
          properties:
            state: { type: string, enum: [ok, limited] }
            until: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
            basis:
              type: string
              enum: [reported, inferred]
              description: |
                `reported`: from the rate-limit report Claude Code sends with
                every model call. `inferred`: from the wording of a failed
                job, or nothing has been reported yet. Neither is measured by
                the Lab Manager; both arrive through the agent side.
            reportedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
            windows:
              type: object
              description: Per allowance window as Claude Code names it (for example five_hour, seven_day).
              additionalProperties:
                type: object
                required: [utilization, resetsAt]
                properties:
                  utilization: { type: number, description: "Fraction used, 0 to 1." }
                  resetsAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
            overage:
              type: object
              description: Paid usage beyond the subscription. If `inUse` is ever reported true the job is stopped, all model work is suspended and an `unauthorized_charge` escalation is raised.
              required: [status, inUse]
              properties:
                status: { type: [string, "null"] }
                inUse: { type: boolean }
        limits:
          type: object
          description: Host settings a client may want to show. Not settable through the API.
          properties:
            delegationsPerMessage: { type: integer, description: "How many handoffs of one owner message are dispatched; further ones are refused with `over_cap`." }
        resources:
          type: object
          required: [jobs, disk, identities]
          properties:
            jobs:
              type: object
              description: One limit for the whole host. At the limit a new job is refused with 429 `host_busy`.
              required: [running, hostLimit]
              properties: { running: { type: integer }, hostLimit: { type: integer } }
            disk:
              type: object
              description: Below `minFreeBytes` no job starts (412 `disk_low`); below half of it running jobs are stopped.
              required: [minFreeBytes, freeBytes]
              properties:
                minFreeBytes: { type: number }
                freeBytes: { type: object, additionalProperties: { type: [number, "null"] }, description: "Per identity (agent, reviewer) and for the manager's own storage. Refreshed every 30 seconds." }
            identities:
              type: object
              description: Memory, CPU time and process count per agent identity, read by its worker from its own control group. Null where the host does not expose it.
              additionalProperties:
                type: object
                properties:
                  memoryBytes: { type: [number, "null"] }
                  cpuSeconds: { type: [number, "null"] }
                  processes: { type: [number, "null"] }
        reviewIndependence: { $ref: "#/components/schemas/ReviewIndependence" }
        capabilities:
          type: object
          description: What this deployment currently permits, so the UI can disable controls up front.
          required: [executorShell, unattendedExecution, tmuxMode, recordWrites, shell]
          properties:
            recordWrites:
              $ref: "#/components/schemas/Capability"
              description: |
                Manual mode: a standing rule the owner sets on the host. When
                allowed, an agent's Write of one record file directly inside
                its own outbox is permitted without a per-request approval.
                Always allowed under an autonomous policy.
            workspaceWrites:
              $ref: "#/components/schemas/Capability"
              description: |
                Manual mode: a standing rule the owner sets on the host. When
                allowed, an agent's Write, Edit or NotebookEdit of a file
                inside its own workspace is permitted without a per-request
                approval. Files that steer Claude Code itself (`CLAUDE.md`,
                `.mcp.json`, anything under `.claude`) are not covered.
                Reason `superseded_by_policy` under an autonomous policy,
                where the policy answers instead.
            webSearch:
              $ref: "#/components/schemas/Capability"
              description: Manual mode, set the same way. When allowed, WebSearch is permitted without a per-request approval.
            uncoveredRequests:
              type: string
              enum: [ask, deny, policy]
              description: |
                What happens to a tool request no standing rule covers. `ask`:
                it becomes an approval and the task waits for a signed
                decision. `deny`: the owner chose on the host not to be asked;
                it is refused at once, the agent is told, and the task carries
                on. `policy`: a host policy answers every request.
            delegation:
              $ref: "#/components/schemas/Capability"
              description: Manual mode, set on the host. When allowed, the Orchestrator's handoffs recorded in reply to the owner are started as tasks by the manager. Host-wide; there is no per-lab switch.
            executorShell: { $ref: "#/components/schemas/Capability", description: "Deprecated; same as shell.executor." }
            unattendedExecution: { $ref: "#/components/schemas/Capability" }
            tmuxMode: { $ref: "#/components/schemas/Capability" }
            shell:
              type: object
              description: Per role, whether a job started now would have a shell, and on which boundary.
              required: [advisor, executor, reviewer, orchestrator]
              additionalProperties: { $ref: "#/components/schemas/ShellCapability" }
        status: { type: string, enum: [ok, degraded] }
        apiVersion: { type: string, description: "major.minor; the major number changes on any breaking change." }
        serviceVersion: { type: string }
        degraded: { type: boolean }
        reasons:
          type: array
          items:
            type: string
            enum: [claude_code_unavailable, claude_code_logged_out, tmux_unavailable, agent_isolation_missing, storage_error]

    ShellCapability:
      type: object
      required: [allowed, reason, boundary]
      properties:
        allowed: { type: boolean }
        reason:
          type: [string, "null"]
          description: |
            Why not. Known values: no_autonomy_policy, role_not_granted,
            worker_unavailable, agent_isolation_missing, isolation_unverified,
            isolation_check_failed, reviewer_identity_missing,
            sandbox_unavailable.
        boundary:
          type: [string, "null"]
          enum: [osIdentity, osIdentityAndCommandSandbox, null]
          description: |
            What confines the shell. `osIdentity`: a dedicated OS user with
            no administrative rights inside a hardened service.
            `osIdentityAndCommandSandbox`: that, and every command also runs
            in Claude Code's sandbox and cannot opt out of it.
    ReviewIndependence:
      type: string
      enum: [enforced, notEnforced]
      description: |
        `enforced` only when the Reviewer runs as a different OS user from
        every other role AND the isolation checks of both identities pass,
        which include that neither can read or write where the other keeps
        its files. Otherwise `notEnforced`.
    PolicyDecision:
      type: object
      description: |
        A decision made by the host policy instead of a human. It has no
        actor and no authorization, and must never be displayed as a
        signature. Immutable.
      required: [id, labId, jobId, agentId, subject, subjectId, rule, outcome, summary, facts, policy, at]
      additionalProperties: false
      properties:
        id: { type: string }
        labId: { type: string }
        jobId: { type: [string, "null"] }
        agentId: { type: [string, "null"] }
        subject: { type: string, enum: [experiment, tool, job] }
        subjectId: { type: [string, "null"], description: "Experiment id, tool use id or job id." }
        rule:
          type: string
          description: "Known values: experiment.admit, shell.run, tool.use, sandbox.escape, request.tooLarge, interrupted.acknowledge."
        outcome: { type: string, enum: [allow, deny] }
        summary: { type: string }
        facts: { type: object, additionalProperties: true, description: "What the rule matched on." }
        policy:
          type: object
          required: [id, hash]
          properties:
            id: { type: string }
            hash: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }

    Capability:
      type: object
      required: [allowed, reason]
      properties:
        allowed: { type: boolean }
        reason: { type: [string, "null"], description: "Why it is not allowed. A free string; see Status semantics." }
    SignedAuthorization:
      type: object
      description: |
        Proof that Runekeeper recorded one authenticated human action: who,
        which action, on what, under which limits, and until when.

        `signature` is base64 of the 64-byte Ed25519 signature over the UTF-8
        bytes of these ten lines joined by "\n" (no trailing newline):

          lab-authz-v3
          <action>        approval.decision | budget.set
          <targetId>      approvalId | labId
          <bindingHash>   sha256 hex of the RFC 8785 canonical JSON of the binding
          <outcome>       approved | denied | set
          <actorId>       must equal X-Lab-Actor-Id
          <signedAt>      exactly as sent
          <expiresAt>     exactly as sent
          <nonce>         exactly as sent
          <noteHash>      sha256 hex of the UTF-8 bytes of `note` (of the empty
                          string when there is no note)

        The binding is what is being authorized (see ApprovalBinding,
        BudgetBinding). The Lab Manager publishes the binding and
        its hash on Approval; Runekeeper recomputes the hash from the
        binding it shows the human and refuses to sign on a mismatch. For a
        budget change Runekeeper builds the binding itself.

        The Lab Manager rejects with 403 `signature_invalid` when: the
        signature does not verify; the actor differs from the header;
        `expiresAt` is not after `signedAt` or is more than five minutes
        after it; `signedAt` is more than one minute in the future; the
        current time is after `expiresAt`; for an approval decision,
        `expiresAt` is after the approval's own `expiresAt`; or the nonce or
        the signature has been accepted before.

        A 403 `signature_invalid` carries `details.reason`: `missing`,
        `malformed`, `window_invalid`, `not_yet_valid`, `expired`,
        `exceeds_target_expiry`, `replayed` or `binding_or_key_mismatch`. The
        last covers both a stale view of what is being authorized and a wrong
        key, which the verifier cannot tell apart: refetch, rebuild the
        binding and sign once more; if it fails again, stop.

        Replay protection: every accepted nonce and signature is stored
        permanently with the authorization record and never accepted again. The one exception is an exact retry: the same
        `Idempotency-Key` with the same body returns the original response.

        Every accepted authorization is stored with its binding, so it can be
        re-verified later with only the public key.

        Test vectors (bindings, canonical JSON, hashes, signed text and
        signatures made with a public test key): `docs/api/binding-vectors.json`.
      required: [signedAt, expiresAt, nonce, signature]
      properties:
        signedAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        nonce: { type: string, pattern: "^[A-Za-z0-9_-]{22,128}$", description: "At least 16 random bytes, base64url without padding." }
        signature: { type: string }
        keyId:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: |
            Identifies the signing key: the first 16 hex characters of sha256
            over the public key's SPKI DER encoding. Optional but recommended.
            During a key rotation the Lab Manager accepts more than one key;
            it tries the named key first and records the id of the key that
            verified with the stored authorization.
    BindingLimits:
      type: object
      description: |
        Limits as written into a binding. Non-integer quantities are decimal
        strings with exactly six fractional digits (JavaScript:
        `n.toFixed(6)`), so the hash never depends on how a JSON library
        prints a floating-point number. Null means not set.

        No dollar figure appears in a binding other than BudgetBinding. The
        notional model cost is an agent-side estimate and gates nothing a
        signature covers, so it is not signed.
      required: [wallClockMinutes]
      additionalProperties: false
      properties:
        wallClockMinutes: { type: [string, "null"], pattern: "^[0-9]+\\.[0-9]{6}$" }
        maxTurns: { type: [integer, "null"] }
    ApprovalBinding:
      type: object
      description: What a human authorizes by deciding an approval. Always complete, even where `request` is truncated.
      required: [contractVersion, approvalId, kind, labId, agentId, role, jobId, experimentId, requestHash, limits, estimate, expiresAt, policyHash]
      properties:
        contractVersion: { type: string, const: "1.0" }
        approvalId: { type: string }
        kind: { $ref: "#/components/schemas/ApprovalKind" }
        labId: { type: string }
        agentId: { type: string }
        role: { $ref: "#/components/schemas/AgentRole" }
        jobId: { type: [string, "null"] }
        experimentId:
          type: [string, "null"]
          description: |
            Kind `permission`: exactly the requesting job's `experimentId`
            (null when the job belongs to no experiment); a client that
            rebuilds the binding takes it from the job record. Kind
            `experiment`: `request.experimentId`, and `jobId` is null.
        requestHash: { type: string }
        limits: { $ref: "#/components/schemas/BindingLimits", description: "The limits the approved work runs under." }
        estimate: { $ref: "#/components/schemas/BindingLimits" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        policyHash:
          type: [string, "null"]
          description: |
            `Health.policy.hash` when the approval was requested; null in
            manual mode without a policy file. A decision is refused (409,
            and the approval is cancelled) if the policy in force differs.
    BudgetBinding:
      type: object
      description: |
        What a human authorizes by setting a lab's spending limit. Built by
        Runekeeper. `previousSpendLimitUsd` must equal the limit in force
        when the call arrives, and `policyHash` must equal
        `Health.policy.hash` (null without a policy): an authorization made
        against a stale view, or under another policy, does not verify (403
        `signature_invalid`). Amounts are decimal strings with exactly six
        fractional digits.
      required: [contractVersion, labId, previousSpendLimitUsd, spendLimitUsd, policyHash]
      additionalProperties: false
      properties:
        contractVersion: { type: string, const: "1.0" }
        labId: { type: string }
        previousSpendLimitUsd: { type: string, pattern: "^[0-9]+\\.[0-9]{6}$" }
        spendLimitUsd: { type: string, pattern: "^[0-9]+\\.[0-9]{6}$" }
        policyHash: { type: [string, "null"] }
    Actor:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string }

    LabStatus: { type: string, enum: [stopped, starting, running, paused, degraded] }
    CycleStage:
      type: string
      enum: [idle, question, hypothesis, design, protocolRegistered, awaitingApproval, execution, review, findings, stateUpdate, decision, escalated]
    LabDeletionReceipt:
      type: object
      required: [labId, name, deletedAt, removed, kept]
      properties:
        labId: { type: string }
        name: { type: string }
        deletedAt: { $ref: "#/components/schemas/Timestamp" }
        removed:
          type: object
          required: [agents, jobs, transcriptItems, records, workspaces]
          properties:
            agents: { type: integer }
            jobs: { type: integer }
            transcriptItems: { type: integer }
            records: { type: integer, description: "Questions, experiments and every kind of research record." }
            workspaces: { type: integer, description: "Workspace directories that existed and were removed." }
        kept:
          type: object
          required: [tombstone, signedAuthorizations]
          properties:
            tombstone: { type: boolean }
            signedAuthorizations: { type: integer }
    LabSummary:
      type: object
      required: [id, name, status, cycleStage, pendingApprovalCount, openEscalationCount, autonomous, lastActivityAt]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/LabStatus" }
        cycleStage: { $ref: "#/components/schemas/CycleStage" }
        pendingApprovalCount: { type: integer }
        openEscalationCount: { type: integer }
        autonomous: { type: boolean, description: "True when the host policy lets this lab advance without a human approving each step." }
        lastActivityAt: { $ref: "#/components/schemas/Timestamp" }
        archivedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }], description: "Set while the lab is archived." }
    Lab:
      allOf:
        - $ref: "#/components/schemas/LabSummary"
        - type: object
          required: [objective, priorities, approvalPolicy, createdAt]
          properties:
            approvalPolicy: { $ref: "#/components/schemas/ApprovalPolicy" }
            objective: { type: [string, "null"] }
            priorities: { type: array, items: { type: string } }
            createdAt: { $ref: "#/components/schemas/Timestamp" }
    BudgetLimits:
      type: object
      deprecated: true
      required: [costUsd, wallClockMinutes]
      properties:
        costUsd: { type: number, minimum: 0, description: "Money only: the signed spending limit." }
        wallClockMinutes: { type: number, minimum: 0 }
    ApprovalPolicy:
      type: object
      required: [permissionTtlMinutes, experimentTtlMinutes]
      properties:
        permissionTtlMinutes: { type: integer, minimum: 1, maximum: 1440, default: 30 }
        experimentTtlMinutes: { type: integer, minimum: 1, default: 10080 }
    Budget:
      type: object
      description: |
        Three kinds of number that must never be mixed or summed. Each block
        says where its numbers come from in `source`.
      required: [runtime, spend, estimates, limits, consumed]
      properties:
        runtime:
          type: object
          description: Measured by the Lab Manager. Cannot be under-reported by an agent. This is the limit that binds.
          required: [limitWallClockMinutes, usedWallClockMinutes, source]
          properties:
            limitWallClockMinutes: { type: number }
            usedWallClockMinutes: { type: number }
            source: { type: string, const: managerMeasured }
        spend:
          type: object
          description: Money beyond what the owner already pays for.
          required: [signedLimitUsd, verifiedChargesUsd, remainingUsd, metering, source]
          properties:
            signedLimitUsd: { type: number, description: "Set only by a signed `budget.set`. Default 0." }
            verifiedChargesUsd:
              type: [number, "null"]
              description: "Charges the Lab Manager verified itself. Null, not 0, while metering is `none`: nothing can be verified."
            remainingUsd: { type: [number, "null"] }
            metering: { type: string, enum: [none, active] }
            source: { type: string, const: managerVerified }
        estimates:
          type: object
          description: |
            Reported by Claude Code on the agent side. Never a charge and
            never verified. `notionalModelCostUsd` is what the same usage
            would cost at API prices; under a subscription nothing is owed
            for it.
          required: [notionalModelCostUsd, tokens, source]
          properties:
            notionalModelCostUsd: { type: number }
            tokens: { type: integer }
            source: { type: string, const: agentReported }
        limits: { $ref: "#/components/schemas/BudgetLimits" }
        consumed:
          type: object
          deprecated: true
          required: [costUsd, wallClockMinutes]
          properties:
            costUsd: { type: number, description: "Always 0. Money only; never an estimate." }
            wallClockMinutes: { type: number }
    LabSnapshot:
      type: object
      required: [lab, agents, activeQuestion, pendingApprovals, jobsNeedingReconciliation, budget, openEscalations, recentFindings, recentEvents, eventCursor]
      properties:
        lab: { $ref: "#/components/schemas/Lab" }
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        activeQuestion:
          oneOf:
            - $ref: "#/components/schemas/Question"
            - type: "null"
        pendingApprovals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        jobsNeedingReconciliation: { type: array, items: { $ref: "#/components/schemas/Job" } }
        budget: { $ref: "#/components/schemas/Budget" }
        openEscalations: { type: array, items: { $ref: "#/components/schemas/Escalation" } }
        recentFindings: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/Finding" } }
        recentEvents: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Event" } }
        eventCursor: { type: string, description: "Subscribe with after=<eventCursor> for no gap and no duplicate." }

    AgentRole: { type: string, enum: [advisor, executor, reviewer, orchestrator] }
    AgentState: { type: string, enum: [notProvisioned, starting, idle, working, waitingOnHuman, stopped, crashed] }
    AgentMode: { type: string, enum: [managed, tmux] }
    Agent:
      type: object
      required: [id, labId, role, state, mode, sessionId, hasTmux, tmuxAttachHint, currentJob, blockedBy, pendingApprovalCount, lastActivityAt, lastError]
      properties:
        blockedBy:
          type: [object, "null"]
          description: Why no new task is dispatched to this agent.
          required: [reason]
          properties:
            reason: { type: string, enum: [reconciliation, labPaused, isolationRequired] }
            jobId: { type: [string, "null"] }
        id: { type: string }
        labId: { type: string }
        role: { $ref: "#/components/schemas/AgentRole" }
        state: { $ref: "#/components/schemas/AgentState" }
        mode: { $ref: "#/components/schemas/AgentMode" }
        sessionId: { type: [string, "null"], description: "Claude Code session uuid." }
        hasTmux: { type: boolean }
        tmuxAttachHint: { type: [string, "null"], description: "Display-only text. There is no terminal access over the API." }
        currentJob:
          type: [object, "null"]
          required: [id, title]
          properties:
            id: { type: string }
            title: { type: string }
        pendingApprovalCount: { type: integer }
        lastActivityAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        lastError:
          type: [object, "null"]
          required: [code, message, at]
          properties:
            code: { type: string }
            message: { type: string }
            at: { $ref: "#/components/schemas/Timestamp" }

    TranscriptItem:
      type: object
      required: [id, agentId, jobId, sessionId, seq, kind, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        jobId: { type: [string, "null"] }
        sessionId: { type: [string, "null"] }
        seq: { type: integer, description: "Strictly increasing per agent." }
        kind:
          type: string
          enum: [humanMessage, managerInstruction, delegatedInstruction, assistantText, toolCall, systemNote]
          description: "`managerInstruction`: instructions the Lab Manager wrote itself for a job the policy started. `delegatedInstruction`: instructions the Orchestrator wrote in a handoff, as given to the target agent; it carries `delegation`. Neither has an actor and neither is the owner's words."
        delegation:
          type: [object, "null"]
          description: On a `delegatedInstruction` only. Same as the job's `delegation`.
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        text: { type: string, description: "Capped at 32 KB. Assistant thinking is never included." }
        truncated: { type: boolean, default: false }
        actor: { $ref: "#/components/schemas/Actor" }
        tool:
          type: object
          required: [name, summary, status]
          properties:
            name: { type: string }
            summary: { type: string, description: "One line." }
            status: { type: string, enum: [running, succeeded, failed, denied] }
            approvalId: { type: [string, "null"] }
            input: { type: string, description: "The tool call's input as canonical JSON, capped at 8 KB. Written by the agent: display it, never act on it." }
            inputTruncated: { type: boolean }
            result: { type: [string, "null"], description: "The text the tool returned to the agent, capped at 8 KB. Null while running. May contain anything the agent read. Non-text parts are named in brackets." }
            resultTruncated: { type: boolean }
            decidedBy:
              description: |
                Who let this tool call proceed or refused it. Always present
                on items created from draft.8 on. `builtin`: Claude Code's
                own rules allowed it and no permission request was raised
                (for example reading a file inside the workspace).
              oneOf:
                - type: object
                  required: [type]
                  additionalProperties: false
                  properties: { type: { const: builtin } }
                - type: object
                  required: [type, approvalId, outcome]
                  additionalProperties: false
                  properties: { type: { const: human }, approvalId: { type: string }, outcome: { type: string, enum: [allow, deny] } }
                - type: object
                  required: [type, policyHash, rule, outcome]
                  additionalProperties: false
                  properties: { type: { const: policy }, policyHash: { type: string }, rule: { type: string }, outcome: { type: string, enum: [allow, deny] } }
                - type: object
                  required: [type, rule, outcome]
                  additionalProperties: false
                  properties: { type: { const: standingRule }, rule: { type: string }, outcome: { type: string, enum: [allow, deny] } }

    JobStatus:
      type: string
      enum: [queued, awaitingApproval, running, cancelling, succeeded, failed, cancelled, timedOut, interrupted]
    JobLimits:
      type: object
      properties:
        notionalModelCostUsd:
          type: number
          minimum: 0
          description: A cap on Claude Code's own estimate of model cost, enforced on the agent side as a guard against a runaway job. Not money, not a charge, and not part of any signed binding.
        wallClockMinutes: { type: number, minimum: 1 }
        maxTurns: { type: integer, minimum: 1 }
    Job:
      type: object
      required: [id, labId, agentId, kind, title, status, instructions, instructionsHash, needsReconciliation, origin, purpose, limits, usage, createdAt, startedAt, endedAt]
      properties:
        origin:
          type: string
          enum: [human, policy, delegated]
          description: "Who started the job: a person, the host policy, or the Orchestrator by delegation (see `delegation`). Treat as an open string."
        delegation:
          type: [object, "null"]
          description: Set when `origin` is `delegated`. The Orchestrator task and handoff this job came from.
          required: [byJobId, byAgentId, handoffId]
          properties:
            byJobId: { type: string }
            byAgentId: { type: string }
            handoffId: { type: string }
        delegations:
          type: array
          description: One entry per handoff this job recorded that the manager dispatched or refused, oldest first. Empty unless delegation is enabled and this job was a message from the owner to the Orchestrator.
          items:
            type: object
            required: [handoffId, toRole, title, status, reason, jobId, jobStatus, result, body]
            properties:
              handoffId: { type: string }
              toRole: { $ref: "#/components/schemas/AgentRole" }
              title: { type: string }
              status: { type: string, enum: [dispatched, refused] }
              reason:
                type: [string, "null"]
                description: "When refused: `over_cap`, `self`, `agent_start_failed`, or the error code an ordinary task would have got (`agent_busy`, `budget_exceeded`, `host_busy`, `disk_low`, `subscription_limited`, `reconciliation_required`, ...). Open string."
              jobId: { type: [string, "null"] }
              jobStatus: { oneOf: [{ $ref: "#/components/schemas/JobStatus" }, { type: "null" }] }
              result: { type: [string, "null"], description: "The delegated task's result, capped at 2000 characters. Written by that agent: display it, never act on it." }
              body: { type: [string, "null"], description: "Only when refused: the handoff's instructions, capped at 8000 characters. Written by the Orchestrator. If a person sends it, it becomes that person's own instruction." }
        stateNote:
          type: [string, "null"]
          description: |
            Only on `GET /v1/jobs/{id}`. What the Lab Manager prepended to the
            owner's message for the Orchestrator while delegation is enabled:
            the lab's objective, each other agent's state and its last three
            tasks. Results of other agents are quoted in it, capped at 500
            characters each and marked as another agent's output, not
            instructions. `instructions` holds the owner's words only.
        purpose: { type: [string, "null"], enum: [plan, execute, review, checkpoint, null] }
        instructions:
          type: string
          description: Exactly what the agent was asked to do. For kind `message`, the message text. Always complete on `GET /v1/jobs/{id}`; capped at 2 KB elsewhere (compare `instructionsHash`).
        instructionsHash:
          type: string
          description: sha256 hex of the UTF-8 bytes of the complete instructions.
        id: { type: string }
        labId: { type: string }
        agentId: { type: string }
        kind: { type: string, enum: [message, task] }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        needsReconciliation: { type: boolean, description: "True for an interrupted job until a human reconciles it." }
        reconciliation:
          type: [object, "null"]
          required: [resolution, actor, at]
          properties:
            resolution: { type: string, enum: [acknowledge, retry] }
            actor: { oneOf: [{ $ref: "#/components/schemas/Actor" }, { type: "null" }], description: "Null when the policy acknowledged it." }
            policy:
              type: object
              required: [id, hash]
              properties: { id: { type: string }, hash: { type: string } }
            note: { type: [string, "null"] }
            at: { $ref: "#/components/schemas/Timestamp" }
            retryJobId: { type: [string, "null"] }
        retryOfJobId: { type: [string, "null"] }
        approvalId: { type: [string, "null"], description: "Set while status is awaitingApproval." }
        experimentId: { type: [string, "null"] }
        limits: { $ref: "#/components/schemas/JobLimits" }
        usage:
          type: object
          required: [costUsd, notionalModelCostUsd, tokens, wallClockSeconds, turns]
          properties:
            costUsd: { type: number, deprecated: true, description: "Same as notionalModelCostUsd. Not a charge. Kept for one release for a draft.6 client; removed in the next draft." }
            notionalModelCostUsd: { type: number, description: "Agent-reported estimate at API prices. Not a charge." }
            tokens: { type: integer, description: "Agent-reported." }
            wallClockSeconds: { type: number, description: "Measured by the Lab Manager." }
            turns: { type: integer }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        startedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        endedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        result: { type: [string, "null"], description: "Final assistant summary, when succeeded." }
        error:
          type: [object, "null"]
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    LogLine:
      type: object
      required: [seq, at, stream, text]
      properties:
        seq: { type: integer }
        at: { $ref: "#/components/schemas/Timestamp" }
        stream: { type: string, enum: [stdout, stderr, manager] }
        text: { type: string }

    ApprovalKind: { type: string, enum: [permission, experiment, budget, other] }
    ApprovalStatus: { type: string, enum: [pending, approved, denied, expired, cancelled] }
    Approval:
      type: object
      required: [id, labId, kind, status, requestedBy, title, request, requestHash, requestTruncated, binding, bindingHash, estimate, createdAt, expiresAt, decision]
      properties:
        binding: { $ref: "#/components/schemas/ApprovalBinding" }
        bindingHash: { type: string, description: "sha256 hex of the RFC 8785 canonical JSON of `binding`. This is what a decision signature covers." }
        requestHash:
          type: string
          description: sha256 hex of the RFC 8785 canonical JSON of the COMPLETE request. Runekeeper may recompute it from the detail response.
        requestTruncated:
          type: boolean
          description: |
            True when this representation shortened `request` (lists, the
            snapshot and events cap it at 2 KB). `GET /v1/approvals/{id}`
            always returns the complete request with this false. A tool
            request larger than 256 KB is never offered for approval: the
            manager denies it automatically.
        id: { type: string }
        labId: { type: string }
        kind: { $ref: "#/components/schemas/ApprovalKind" }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        requestedBy:
          type: object
          required: [agentId, role, jobId]
          properties:
            agentId: { type: string }
            role: { $ref: "#/components/schemas/AgentRole" }
            jobId: { type: [string, "null"] }
        title: { type: string }
        request:
          description: Exactly what is being approved, by kind.
          oneOf:
            - title: PermissionRequest
              type: object
              required: [toolName, input]
              properties:
                toolName: { type: string }
                input: { type: object, additionalProperties: true }
            - title: ExperimentRequest
              description: |
                `requestHash` is the SHA-256 of the RFC 8785 form of this
                object. `protocolHash` is the SHA-256 of the exact UTF-8
                bytes of the protocol text, which the client fetches from
                `/v1/labs/{labId}/artifacts/{protocolHash}` and should show
                to the human, verifying the hash itself, before signing.
              type: object
              required: [experimentId, title, hypothesis, protocolVersion, protocolHash]
              additionalProperties: false
              properties:
                experimentId: { type: string }
                title: { type: string }
                hypothesis: { type: [string, "null"] }
                protocolVersion: { type: integer, minimum: 1 }
                protocolHash: { type: string, pattern: "^[0-9a-f]{64}$" }
            - title: BudgetRequest
              description: |
                Never created by a 1.0-draft manager. Approving one changes
                no limit by itself, now or later: limits change only through
                a signed `budget.set`, whose binding carries the previous and
                the new limits. An approved budget request is a record that
                the human agreed; the change is a separate signed act.
              type: object
              required: [requestedLimits]
              properties:
                requestedLimits: { $ref: "#/components/schemas/BudgetLimits" }
                reason: { type: string }
            - title: OtherRequest
              description: Never created by a 1.0-draft manager. A client should offer only `denied`.
              type: object
              required: [description]
              properties:
                description: { type: string }
        estimate:
          type: object
          properties:
            notionalModelCostUsd: { type: [number, "null"], description: "Agent-reported estimate. Not money." }
            wallClockMinutes: { type: [number, "null"] }
            notes: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        decision:
          type: [object, "null"]
          required: [outcome, actor, decidedAt, authorization]
          properties:
            authorization: { $ref: "#/components/schemas/SignedAuthorization" }
            outcome: { type: string, enum: [approved, denied] }
            actor: { $ref: "#/components/schemas/Actor" }
            note: { type: [string, "null"] }
            decidedAt: { $ref: "#/components/schemas/Timestamp" }

    ArtifactRef:
      type: object
      description: Stored, immutable content addressed by the SHA-256 of its bytes.
      required: [hash, size]
      properties:
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer, description: "Bytes." }
    ResearchRecord:
      type: object
      required: [id, labId, title, status, createdAt, updatedAt, artifact]
      properties:
        id: { type: string }
        labId: { type: string }
        title: { type: string }
        status: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        artifact:
          description: The record's body, when it has one.
          oneOf: [{ $ref: "#/components/schemas/ArtifactRef" }, { type: "null" }]
    AgentRecord:
      description: Fields common to records submitted through an agent's outbox or written by a human action.
      allOf:
        - $ref: "#/components/schemas/ResearchRecord"
        - type: object
          required: [kind, experimentId, jobId, role]
          properties:
            kind: { type: string, enum: [result, review, finding, handoff, decision, escalation, checkpoint] }
            experimentId: { type: [string, "null"] }
            jobId: { type: [string, "null"], description: "The job whose outbox the record came from." }
            role:
              description: The submitting agent's role; null for a record written by a human action.
              oneOf: [{ $ref: "#/components/schemas/AgentRole" }, { type: "null" }]
            actor: { $ref: "#/components/schemas/Actor" }
    QuestionStatus: { type: string, enum: [open, active, answered, dropped] }
    Question:
      allOf:
        - $ref: "#/components/schemas/ResearchRecord"
        - type: object
          required: [priority, body, createdBy]
          properties:
            status: { $ref: "#/components/schemas/QuestionStatus" }
            priority: { type: string, enum: [low, medium, high] }
            body: { type: [string, "null"] }
            createdBy: { $ref: "#/components/schemas/Actor" }
    ExperimentStatus:
      type: string
      description: |
        protocolRegistered -> approved -> running -> executed -> underReview
        -> reviewed. In manual mode `awaitingApproval` sits between the first
        two. `blocked`: the proposal declares a paid resource or credential.
        `abandoned` from any state that is not final. Denial, expiry or a
        failed attempt return it to protocolRegistered; a revision registers
        a new version and is admitted or sent for approval again. A review
        without a valid verdict returns it to executed. `draft` is reserved.
      enum: [draft, protocolRegistered, awaitingApproval, approved, running, executed, underReview, reviewed, blocked, abandoned]
    ProtocolVersion:
      type: object
      required: [version, hash, registeredAt, artifact]
      properties:
        version: { type: integer, minimum: 1 }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        registeredAt: { $ref: "#/components/schemas/Timestamp" }
        artifact: { $ref: "#/components/schemas/ArtifactRef" }
    Experiment:
      allOf:
        - $ref: "#/components/schemas/ResearchRecord"
        - type: object
          required: [questionId, hypothesis, protocol, approvedProtocolHash, approvalId, approvedUntil, limits, estimate, reviewVerdict, proposedBy, admission, attempts, needsDecision, requires, blockedReason, snapshot, reviewIndependence, assessment]
          properties:
            status: { $ref: "#/components/schemas/ExperimentStatus" }
            questionId: { type: [string, "null"] }
            hypothesis: { type: [string, "null"] }
            protocol:
              $ref: "#/components/schemas/ProtocolVersion"
              description: The current version.
            approvedProtocolHash:
              type: [string, "null"]
              description: Set while an approval for exactly this hash is in force or was used for the recorded execution.
            approvalId: { type: [string, "null"], description: "The most recent approval raised for this experiment." }
            approvedUntil:
              description: While the status is `approved`, the moment the approval lapses; otherwise null.
              oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
            limits:
              type: object
              description: The limits an execution runs under. `wallClockMinutes` and `maxTurns` are bound into a human approval; the notional model cost is not.
              required: [notionalModelCostUsd, wallClockMinutes, maxTurns]
              properties:
                notionalModelCostUsd: { type: number, description: "Cap on the agent-side estimate. Not money." }
                wallClockMinutes: { type: number }
                maxTurns: { type: integer }
            estimate:
              type: object
              description: The proposing agent's own estimate. Agent-reported.
              required: [notionalModelCostUsd, wallClockMinutes, notes]
              properties:
                notionalModelCostUsd: { type: [number, "null"] }
                wallClockMinutes: { type: [number, "null"] }
                notes: { type: [string, "null"] }
            reviewVerdict: { type: [string, "null"], enum: [supported, notSupported, inconclusive, methodologyProblem, null] }
            admission:
              description: How the current protocol came to be allowed to run. Exactly one shape, or null while it is not.
              oneOf:
                - type: "null"
                - type: object
                  required: [type, approvalId]
                  additionalProperties: false
                  properties: { type: { const: human }, approvalId: { type: string } }
                - type: object
                  required: [type, decisionId, policyId, policyHash, rule, at]
                  additionalProperties: false
                  properties:
                    type: { const: policy }
                    decisionId: { type: string }
                    policyId: { type: string }
                    policyHash: { type: string }
                    rule: { type: string }
                    at: { $ref: "#/components/schemas/Timestamp" }
            attempts: { type: integer, description: "Executions of the current protocol version that ended without a result." }
            needsDecision: { type: boolean, description: "The policy will not run it again by itself: it was interrupted, or used up its attempts. The Advisor must revise or abandon it." }
            requires:
              type: object
              description: What the proposing agent says the experiment needs beyond what the lab already has. Agent-reported.
              required: [paidResources, credentials]
              properties:
                paidResources: { type: array, items: { type: string } }
                credentials: { type: array, items: { type: string } }
            blockedReason: { type: [string, "null"], enum: [paid_resources_unavailable, null] }
            snapshot:
              description: The Lab Manager's own copy of the experiment's working directory, taken when the execution ended. Null if the directory did not exist.
              oneOf:
                - type: "null"
                - type: object
                  required: [hash, size, commit, takenAt]
                  properties:
                    hash: { type: string, pattern: "^[0-9a-f]{64}$", description: "sha256 of the tar archive, computed by the Lab Manager from the bytes it received." }
                    size: { type: integer }
                    commit: { type: [string, "null"], description: "What git reported in the Executor's directory. Reported by the agent side; the repository is inside the snapshot." }
                    takenAt: { $ref: "#/components/schemas/Timestamp" }
            reviewIndependence:
              description: As it was when the review verdict was recorded. Null before that.
              oneOf: [{ $ref: "#/components/schemas/ReviewIndependence" }, { type: "null" }]
            assessment:
              description: A person's optional opinion. Unsigned; never display it as a signature.
              oneOf:
                - type: "null"
                - type: object
                  required: [outcome]
                  properties:
                    outcome: { type: string, enum: [agree, disagree] }
                    note: { type: [string, "null"] }
                    actor: { $ref: "#/components/schemas/Actor" }
                    at: { $ref: "#/components/schemas/Timestamp" }
                    authentication: { type: string, const: unsigned }
            proposedBy:
              type: object
              required: [agentId, role]
              properties:
                agentId: { type: string }
                role: { $ref: "#/components/schemas/AgentRole" }
    ExperimentDetail:
      allOf:
        - $ref: "#/components/schemas/Experiment"
        - type: object
          required: [protocolVersions, jobs, approvals, results, review]
          properties:
            protocolVersions: { type: array, items: { $ref: "#/components/schemas/ProtocolVersion" } }
            jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
            approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
            results: { type: array, items: { $ref: "#/components/schemas/Result" } }
            review: { oneOf: [{ $ref: "#/components/schemas/Review" }, { type: "null" }] }
    Result:
      description: What the Executor recorded for one execution. The protocol hash is assigned by the Lab Manager, not claimed by the agent.
      allOf:
        - $ref: "#/components/schemas/AgentRecord"
        - type: object
          required: [protocolVersion, protocolHash]
          properties:
            protocolVersion: { type: integer }
            protocolHash: { type: string }
    Review:
      description: A verdict the Lab Manager accepted because it cites exactly the protocol, results and snapshot issued for review.
      allOf:
        - $ref: "#/components/schemas/AgentRecord"
        - type: object
          required: [verdict, protocolHash, resultHashes, snapshotHash, independence]
          properties:
            verdict: { type: string, enum: [supported, notSupported, inconclusive, methodologyProblem] }
            protocolHash: { type: string }
            resultHashes: { type: array, items: { type: string } }
            snapshotHash: { type: [string, "null"] }
            independence: { $ref: "#/components/schemas/ReviewIndependence" }
    Finding:
      allOf:
        - $ref: "#/components/schemas/AgentRecord"
        - type: object
          required: [summary, supportingExperimentIds, reviewStatus, supportingVerdicts]
          properties:
            summary: { type: string }
            supportingExperimentIds: { type: array, items: { type: string } }
            supportingVerdicts:
              type: object
              description: The review verdict of each cited experiment, or null where there is none yet. A finding may rest on a negative verdict.
              additionalProperties: { type: [string, "null"] }
            reviewStatus:
              type: string
              description: "`reviewed` only when it cites at least one experiment and every cited experiment has a recorded review. Read `supportingVerdicts` for what the reviews said."
              enum: [unreviewed, reviewed, disputed]
    Handoff:
      allOf:
        - $ref: "#/components/schemas/AgentRecord"
        - type: object
          required: [fromRole, toRole, dispatch]
          properties:
            fromRole: { $ref: "#/components/schemas/AgentRole" }
            toRole: { $ref: "#/components/schemas/AgentRole" }
            dispatch:
              type: [object, "null"]
              description: What the manager did with the handoff under delegation. Null when it started nothing because delegation is off or the handoff was not eligible. A refused handoff keeps its title and body, so a person can send it by hand as an ordinary instruction.
              required: [status, reason, jobId, at]
              properties:
                status: { type: string, enum: [dispatched, refused] }
                reason: { type: [string, "null"] }
                jobId: { type: [string, "null"] }
                at: { $ref: "#/components/schemas/Timestamp" }
    ResearchDecision:
      allOf:
        - $ref: "#/components/schemas/AgentRecord"
        - type: object
          properties:
            outcome: { type: string, enum: [agree, disagree, abandoned, answered, dropped], description: "Present when the entry records owner feedback, an abandonment or a question's resolution." }
            reviewVerdict: { type: [string, "null"] }
            questionId: { type: string }
            source: { type: string, enum: [human] }
            authentication: { type: string, const: unsigned, description: "Present on owner feedback. Nothing in the decision log is signed." }
    Escalation:
      description: |
        Something a person should look at: a stop condition the Lab Manager
        met (`source: manager`) or a request from an agent. Resolving one is
        an acknowledgement only.
      allOf:
        - $ref: "#/components/schemas/AgentRecord"
        - type: object
          required: [reason, source]
          properties:
            status: { type: string, enum: [open, resolved] }
            reason:
              type: string
              enum: [unauthorized_charge, security_boundary, runtime_exhausted, no_open_questions, repeated_failures, no_progress, disk_low, human_decision]
            source: { type: string, enum: [manager, agent] }
            resolution:
              type: object
              required: [actor, at]
              properties:
                actor: { $ref: "#/components/schemas/Actor" }
                note: { type: [string, "null"] }
                at: { $ref: "#/components/schemas/Timestamp" }
    Checkpoint:
      description: |
        A progress report. `source: agent`: the Orchestrator's narrative,
        with the Lab Manager's own measurements attached as `facts`.
        `source: manager`: facts only, written when the Orchestrator
        produced nothing. A checkpoint is for visibility; it gates nothing.
      allOf:
        - $ref: "#/components/schemas/AgentRecord"
        - type: object
          required: [source, facts]
          properties:
            source: { type: string, enum: [agent, manager] }
            facts:
              type: object
              required: [at, experimentsReviewed, experiments, runtime, jobs, estimates, spend, policyDecisions, openQuestions]
              properties:
                at: { $ref: "#/components/schemas/Timestamp" }
                experimentsReviewed: { type: integer }
                experiments: { type: array, items: { type: object, additionalProperties: true } }
                runtime: { type: object, additionalProperties: true }
                jobs: { type: object, additionalProperties: { type: integer }, description: "Job counts by status." }
                estimates: { type: object, additionalProperties: true, description: "Agent-reported." }
                spend: { type: object, additionalProperties: true }
                policyDecisions:
                  type: object
                  description: What ran without a person, by rule.
                  additionalProperties:
                    type: object
                    required: [allow, deny]
                    properties: { allow: { type: integer }, deny: { type: integer } }
                openQuestions: { type: array, items: { type: object, additionalProperties: true } }
    Artifact:
      type: object
      required: [hash, size, contentType, encoding, content, truncated]
      properties:
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer }
        contentType: { type: string }
        encoding: { type: string, enum: [utf8] }
        content: { type: string }
        truncated: { type: boolean, const: false }

    EventType:
      type: string
      enum:
        - manager.started
        - lab.created
        - lab.updated
        - lab.deleted
        - lab.statusChanged
        - agent.stateChanged
        - transcript.itemAdded
        - transcript.itemUpdated
        - job.created
        - job.statusChanged
        - job.reconciled
        - job.updated
        - approval.requested
        - approval.resolved
        - question.created
        - question.updated
        - result.recorded
        - review.recorded
        - experiment.updated
        - finding.recorded
        - decision.recorded
        - handoff.recorded
        - handoff.dispatched
        - escalation.recorded
        - escalation.resolved
        - checkpoint.recorded
        - policy.decided
        - budget.updated
        - budget.thresholdCrossed
        - manager.healthChanged
        - agent.modeChanged
    ManagerStartedData:
      type: object
      required: [serviceVersion, interruptedJobs]
      properties:
        serviceVersion: { type: string }
        interruptedJobs:
          type: array
          items:
            type: object
            required: [labId, jobId]
            properties:
              labId: { type: string }
              jobId: { type: string }
    BudgetThresholdData:
      type: object
      required: [metric, threshold, consumed, limit]
      properties:
        metric: { type: string, enum: [wallClockMinutes] }
        threshold: { type: number, description: "Fraction of the limit, e.g. 0.8." }
        consumed: { type: number }
        limit: { type: number }
    Event:
      type: object
      required: [id, type, labId, at, data]
      properties:
        id: { type: string, description: "The cursor." }
        type: { $ref: "#/components/schemas/EventType" }
        labId:
          type: [string, "null"]
          description: Null for manager-level events, which are delivered to every subscriber, including those filtered by labId.
        actor:
          description: Present on events caused by a human action.
          oneOf:
            - $ref: "#/components/schemas/Actor"
            - type: "null"
        at: { $ref: "#/components/schemas/Timestamp" }
        data:
          type: object
          additionalProperties: true
          description: |
            Always the full object, never a delta, so clients can replace by
            id. By type: lab.* -> Lab · agent.* -> Agent · transcript.* ->
            TranscriptItem · job.* -> Job · approval.* -> Approval
            (approval.resolved also fires for expired and cancelled) ·
            question.created, question.updated -> Question ·
            experiment.updated -> Experiment · result.recorded -> Result ·
            review.recorded -> Review · finding.recorded -> Finding ·
            decision.recorded -> ResearchDecision · handoff.recorded, handoff.dispatched -> Handoff · job.updated -> Job ·
            escalation.recorded, escalation.resolved -> Escalation ·
            checkpoint.recorded -> Checkpoint · policy.decided ->
            PolicyDecision (experiment and job decisions only; tool
            decisions are on the transcript item and in the list) · budget.updated -> Budget (on job end
            and at most every 30 seconds while a job runs) ·
            budget.thresholdCrossed -> BudgetThresholdData · manager.started ->
            ManagerStartedData · manager.healthChanged -> Health.
